<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet Check</title>
<style>
body{font-family:sans-serif;background:#fff;color:#111;margin:0;padding:12px;font-size:15px;}
h1{font-size:19px;margin:0 0 6px 0;}
h2{font-size:15px;margin:16px 0 4px 0;border-bottom:1px solid #bbb;padding-bottom:3px;}
pre{white-space:pre-wrap;word-wrap:break-word;background:#f1f1f1;padding:8px;font-size:13px;margin:4px 0;}
table{border-collapse:collapse;width:100%;font-size:14px;}
td{padding:3px 4px;border-bottom:1px solid #eee;}
td.v{width:70px;font-weight:bold;}
.ok{color:#0a7a48;}
.no{color:#c00000;}
button{font-size:16px;padding:10px 16px;margin-top:10px;}
</style>
</head>
<body>

<h1>Tablet Check</h1>

<h2>User agent</h2>
<pre id="ua">-</pre>

<h2>Screen and clock</h2>
<pre id="scr">-</pre>

<h2>JavaScript features</h2>
<table id="feat"></table>

<h2>CSS features</h2>
<table id="css"></table>

<h2>Network to lab.wsmail.ws</h2>
<div id="net">not run yet</div>
<button id="btn">Run network test again</button>

<script>
function el(id){return document.getElementById(id);}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function canRun(src){
  try{ eval(src); return true; }catch(e){ return false; }
}

/* ---- user agent ---- */
el('ua').innerHTML = esc(navigator.userAgent);

/* ---- screen + clock ---- */
var sc = window.screen || {};
var now = new Date();
el('scr').innerHTML = esc(
  'window   : ' + window.innerWidth + ' x ' + window.innerHeight + ' css px\n' +
  'screen   : ' + (sc.width||'?') + ' x ' + (sc.height||'?') + '\n' +
  'pixelRatio: ' + (window.devicePixelRatio || 'n/a') + '\n' +
  'touch    : ' + (('ontouchstart' in window) ? 'yes' : 'no') + '\n' +
  'clock    : ' + now.toString() + '\n' +
  'page     : ' + location.href
);

/* ---- javascript feature probes ---- */
var jsTests = [
  ['XMLHttpRequest', function(){ return typeof XMLHttpRequest !== 'undefined'; }],
  ['fetch',          function(){ return typeof fetch === 'function'; }],
  ['Promise',        function(){ return typeof Promise === 'function'; }],
  ['localStorage',   function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(e){ return false; } }],
  ['JSON',           function(){ return typeof JSON !== 'undefined'; }],
  ['let / const',    function(){ return canRun('(function(){"use strict"; let a=1; const b=2; return a+b;})()'); }],
  ['arrow fn',       function(){ return canRun('(function(){ var f = eval("(x)=>x*2"); return f(2)===4; })()'); }],
  ['template lit',   function(){ return canRun('eval("`ab`") === "ab"'); }],
  ['class',          function(){ return canRun('eval("(class Q{})")'); }],
  ['spread',         function(){ return canRun('eval("[].concat(...[[1],[2]])")'); }],
  ['default params', function(){ return canRun('eval("(function(a=1){return a;})()") === 1'); }],
  ['async / await',  function(){ return canRun('eval("(async function(){ return 1; })")'); }],
  ['optional chain', function(){ return canRun('eval("({a:1})?.a") === 1'); }],
  ['nullish ??',     function(){ return canRun('eval("(null ?? 5)") === 5'); }],
  ['Object.assign',  function(){ return typeof Object.assign === 'function'; }],
  ['Object.entries', function(){ return typeof Object.entries === 'function'; }],
  ['Array.from',     function(){ return typeof Array.from === 'function'; }],
  ['Array.includes', function(){ return typeof [].includes === 'function'; }],
  ['String.includes',function(){ return typeof ''.includes === 'function'; }],
  ['String.padStart',function(){ return typeof ''.padStart === 'function'; }],
  ['classList',      function(){ return 'classList' in document.createElement('div'); }],
  ['querySelector',  function(){ return typeof document.querySelector === 'function'; }],
  ['addEventListener',function(){ return typeof window.addEventListener === 'function'; }],
  ['visibilityState',function(){ return typeof document.visibilityState !== 'undefined'; }],
  ['Intl',           function(){ return typeof Intl !== 'undefined'; }]
];

/* ---- css feature probes ---- */
function cssOk(prop, val){
  try{
    var d = document.createElement('div');
    d.style[prop] = val;
    return d.style[prop] === val ||
           d.style[prop] === ('-webkit-' + val) ||
           String(d.style[prop]).indexOf(val) !== -1;
  }catch(e){ return false; }
}
var cssTests = [
  ['display:flex',    function(){ return cssOk('display','flex'); }],
  ['display:grid',    function(){ return cssOk('display','grid'); }],
  ['position:sticky', function(){ return cssOk('position','sticky'); }],
  ['CSS variables',   function(){ return !!(window.CSS && CSS.supports && CSS.supports('(--a: 0)')); }],
  ['CSS.supports',    function(){ return !!(window.CSS && CSS.supports); }],
  ['border-radius',   function(){ return cssOk('borderRadius','8px'); }],
  ['box-shadow',      function(){ return cssOk('boxShadow','0 0 2px #000'); }],
  ['transition',      function(){ return cssOk('transition','all 1s'); }],
  ['viewport units',  function(){ return cssOk('width','50vh'); }]
];

function renderTests(tableId, list){
  var t = el(tableId), html = '', i, pass;
  for(i = 0; i < list.length; i++){
    try{ pass = !!list[i][1](); }catch(e){ pass = false; }
    html += '<tr><td class="v ' + (pass ? 'ok' : 'no') + '">' +
            (pass ? 'YES' : 'no') + '</td><td>' + esc(list[i][0]) + '</td></tr>';
  }
  t.innerHTML = html;
}
renderTests('feat', jsTests);
renderTests('css',  cssTests);

/* ---- network / CORS test ---- */
function netTest(){
  var out = el('net');
  out.innerHTML = 'running...';
  var url = 'https://lab.wsmail.ws/api/hr/punch/pending';
  var t0 = (new Date()).getTime();
  var x;
  try{ x = new XMLHttpRequest(); }
  catch(e){ out.innerHTML = '<span class="no">no XMLHttpRequest</span>'; return; }
  x.open('GET', url, true);
  x.onreadystatechange = function(){
    if(x.readyState !== 4){ return; }
    var ms = (new Date()).getTime() - t0;
    var body = '';
    try{ body = x.responseText ? x.responseText.substring(0, 400) : '(empty)'; }catch(e){ body = '(unreadable)'; }
    if(x.status === 0){
      out.innerHTML = '<span class="no">FAILED &mdash; status 0</span> after ' + ms +
        ' ms.<br>Blocked before a response was readable: CORS, DNS, TLS or the network.';
    }else{
      out.innerHTML = '<span class="ok">HTTP ' + x.status + '</span> in ' + ms +
        ' ms<pre>' + esc(body) + '</pre>';
    }
  };
  try{ x.send(); }
  catch(e){ out.innerHTML = '<span class="no">send() threw</span> ' + esc(e); }
}

if(el('btn').addEventListener){
  el('btn').addEventListener('click', netTest, false);
}else{
  el('btn').onclick = netTest;
}
netTest();
</script>

</body>
</html>
